<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hand </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        } 
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff88;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            z-index: 10;
            background: rgba(10, 10, 15, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // scene set up
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);
        scene.fog = new THREE.Fog(0x0a0a0f, 10, 50);

        const container = document.getElementById('canvas-container');
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth /window.innerHeight,0.1, 1000);
        camera.position.set(0, 0, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // mediapipe 21 landmarks
        const landmarkPositions = [
            [0, -2.5, 0],       // 0: Wrist
            [-0.8, -2, 0],      // 1: Thumb CMC
            [-1.2, -1.3, 0],    // 2: Thumb MCP 
            [-1.4, -0.5, 0],    // 3: Thumb IP 
            [-1.6, 0.3, 0],     // 4: Thumb tip
            [-0.9, 0, 0],       // 5: Index MCP
            [-0.9, 0.9, 0],     // 6: Index PIP
            [-0.9, 1.6, 0],     // 7: Index DIP
            [-0.9, 2.2, 0],     // 8: Index tip
            [-0.15, 0.1, 0],    // 9: Middle MCP
            [-0.15, 1.0, 0],    // 10: Middle PIP
            [-0.15, 1.8, 0],    // 11: Middle DIP
            [-0.15, 2.8, 0],    // 12: Middle tip
            [0.6, 0, 0],         // 13: Ring MCP
            [0.7, 0.9, 0],       // 14: Ring PIP
            [0.75, 1.6, 0],      // 15: Ring DIP
            [0.8, 2.2, 0],       // 16: Ring tip
            [1.2, -0.2, 0],      // 17: Pinky MCP
            [1.4, 0.5, 0],       // 18: Pinky PIP
            [1.5, 1.1, 0],       // 19: Pinky DIP
            [1.6, 1.6, 0]        // 20: Pinky tip
        ];

// (x,y,z)
// x-axis: horizontal (left/right)
// y-axis: vertical (up/down) 
// z-axis: depth (forward/backward) - negative is away from screen, positive is toward screen

// so, for the hand:

// x controls finger spread (like thumb is negative x, pinky is positive x)
// y controls finger length and height (wrist at bottom, fingertips at top)

        // adjust thumb angle for open hand
        const thumbIndices = [1, 2, 3, 4];
        thumbIndices.forEach(idx => {
            landmarkPositions[idx][0] *= 1.1; //spread thumb out more
        });

        // center the hand
        const centerX = (Math.min(...landmarkPositions.map(p => p[0])) + 
                        Math.max(...landmarkPositions.map(p => p[0]))) / 2;
        const centerY = (Math.min(...landmarkPositions.map(p => p[1])) + 
                        Math.max(...landmarkPositions.map(p => p[1]))) / 2;
        
        landmarkPositions.forEach(pos => {
            pos[0] -= centerX;
            pos[1] -= centerY;
        });

        // hand connections based on mediapipe
        const connections = [
            // palm base
            [0, 1], [0, 5], [0, 17],
            [5, 9], [9, 13], [13, 17],
            // thumb
            [1, 2], [2, 3], [3, 4],
            // index finger
            [5, 6], [6, 7], [7, 8],
            // middle finger
            [9, 10], [10, 11], [11, 12],
            // ring finger
            [13, 14], [14, 15], [15, 16],
            // pinky
            [17, 18], [18, 19], [19, 20]
        ];

        // landmark spheres with glow effect
        const landmarks = [];
        const glowSprites = [];
        const pointLights = [];

        const sphereGeometry = new THREE.SphereGeometry(0.08, 16, 16);
        const sphereMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ff88,
            emissive: 0x00ff88,
            emissiveIntensity: 0.8,
            metalness: 0.3,
            roughness: 0.2
        });

        // sprite texture for glow
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(0, 255, 136, 1)');
        gradient.addColorStop(0.3, 'rgba(0, 255, 136, 0.5)');
        gradient.addColorStop(1, 'rgba(0, 255, 136, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        
        const spriteTexture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({
            map: spriteTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.6
        });

        landmarkPositions.forEach((pos, index) => {
            // create sphere
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial.clone());
            sphere.position.set(pos[0], pos[1], pos[2]);
            sphere.userData.originalPos = pos.slice();
            scene.add(sphere);
            landmarks.push(sphere);

            // create glow sprite
            const sprite = new THREE.Sprite(spriteMaterial.clone());
            sprite.position.set(pos[0], pos[1], pos[2]);
            sprite.scale.set(0.4, 0.4, 1);
            scene.add(sprite);
            glowSprites.push(sprite);

            // add point light for each landmark
            const pointLight = new THREE.PointLight(0x00ff88, 0.5, 2);
            pointLight.position.set(pos[0], pos[1], pos[2]);
            scene.add(pointLight);
            pointLights.push(pointLight);
        });

        // create connection cylinders
        const connectionMeshes = [];
        const cylinderMaterial = new THREE.MeshBasicMaterial({
            color: 0x0088ff,
            transparent: true,
            opacity: 0.4
        });

        connections.forEach(([start, end]) => {
            const geometry = new THREE.CylinderGeometry(0.02, 0.02, 1, 8);
            const cylinder = new THREE.Mesh(geometry, cylinderMaterial.clone());
            cylinder.userData.startIndex = start;
            cylinder.userData.endIndex = end;
            scene.add(cylinder);
            connectionMeshes.push(cylinder);
        });

        // just a function to update cylinder position and orientation
        function updateCylinder(cylinder, startPos, endPos) {
            const direction = new THREE.Vector3().subVectors(endPos, startPos);
            const length = direction.length();
            
            cylinder.position.copy(startPos).add(direction.multiplyScalar(0.5));
            cylinder.scale.y = length;
            
            const axis = new THREE.Vector3(0, 1, 0);
            const quaternion = new THREE.Quaternion().setFromUnitVectors(
                axis,
                direction.clone().normalize()
            );
            cylinder.quaternion.copy(quaternion);
        }

        // mininallll animation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // we use gentle floating and pulsing animation
            landmarks.forEach((landmark, index) => {
                const originalPos = landmark.userData.originalPos;
                const floatY = Math.sin(time + index * 0.2) * 0.05;
                const floatX = Math.cos(time * 0.7 + index * 0.3) * 0.02;
                const floatZ = Math.sin(time * 0.5 + index * 0.1) * 0.03;
                
                landmark.position.set(
                    originalPos[0] + floatX,
                    originalPos[1] + floatY,
                    originalPos[2] + floatZ
                );

                // pulsing glow
                const pulse = 0.8 + Math.sin(time * 2 + index * 0.5) * 0.2;
                landmark.material.emissiveIntensity = pulse;
                
                // update sprite and point light
                glowSprites[index].position.copy(landmark.position);
                glowSprites[index].scale.setScalar(0.4 + Math.sin(time * 2 + index * 0.5) * 0.1);
                
                pointLights[index].position.copy(landmark.position);
                pointLights[index].intensity = 0.5 + Math.sin(time * 2 + index * 0.5) * 0.2;
            });

            // update connections
            connectionMeshes.forEach(cylinder => {
                const startPos = landmarks[cylinder.userData.startIndex].position;
                const endPos = landmarks[cylinder.userData.endIndex].position;
                updateCylinder(cylinder, startPos, endPos);
            });

            // gentle rotation of entire scene
            // scene.rotation.y = Math.sin(time * 0.1) * 0.1;

            renderer.render(scene, camera);
            // renderer.outputColorSpace =THREE.SRGBColorSpace;
        }

        // for handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // start the animation
        animate();
    </script>
</body>
</html>
